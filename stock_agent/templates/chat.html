<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investment Advisor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="64" height="64" rx="12" fill="url(#gradient)"/>
                        <path d="M20 35L28 27L36 35L44 23" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="44" cy="23" r="2" fill="white"/>
                        <path d="M16 44H48" stroke="white" stroke-width="2" stroke-linecap="round"/>
                        <defs>
                            <linearGradient id="gradient" x1="0" y1="0" x2="64" y2="64">
                                <stop offset="0%" stop-color="#3b82f6"/>
                                <stop offset="100%" stop-color="#1d4ed8"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <span>Investment Advisor</span>
                </div>
            </div>

            <div class="sidebar-content">
                <button class="new-chat-btn" id="newChatBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                    <span>New Conversation</span>
                </button>
            </div>

            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">
                        <span>{{ username[0].upper() }}</span>
                    </div>
                    <div class="user-details">
                        <span class="username">{{ username }}</span>
                        <a href="/logout" class="logout-link">Sign out</a>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="chat-container">
                <div id="chatMessages" class="chat-messages">
                    <!-- Welcome Message -->
                    <div class="welcome-section">
                        <div class="welcome-icon">
                            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect width="64" height="64" rx="12" fill="url(#gradient2)"/>
                                <path d="M20 35L28 27L36 35L44 23" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                                <circle cx="44" cy="23" r="2" fill="white"/>
                                <path d="M16 44H48" stroke="white" stroke-width="2" stroke-linecap="round"/>
                                <defs>
                                    <linearGradient id="gradient2" x1="0" y1="0" x2="64" y2="64">
                                        <stop offset="0%" stop-color="#3b82f6"/>
                                        <stop offset="100%" stop-color="#1d4ed8"/>
                                    </linearGradient>
                                </defs>
                            </svg>
                        </div>
                        <h2>Welcome to Investment Advisor</h2>
                        <p>Your AI-powered partner for intelligent stock market analysis and investment insights.</p>
                    </div>
                </div>

                <div class="input-container centered" id="inputContainer">
                    <div class="input-wrapper">
                        <textarea
                            id="messageInput"
                            placeholder="Ask me anything about stock investment strategies to get started."
                            rows="1"
                        ></textarea>
                        <button id="sendButton" class="send-button" disabled>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                            </svg>
                        </button>
                    </div>
                    <p class="input-hint">Press Enter to send, Shift + Enter for new line</p>
                </div>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
